<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PAC-MAN Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Fullscreen Game Container */
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Responsive Canvas */
        #game-canvas {
            display: block;
            border: 3px solid #1a1aff;
            box-shadow: 0 0 20px #1a1aff;
            background: #000;
            max-width: 98vw;
            max-height: 90vh;
            object-fit: contain;
        }

        /* Title & Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Arcade Header Title */
        .arcade-title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 15px #FFD700, 0 0 30px #FF8C00;
            letter-spacing: 6px;
            margin-bottom: 20px;
            text-align: center;
            animation: pulse 1.5s infinite alternate;
        }

        /* Subtitle / Ghost Row */
        .ghost-row {
            font-size: 2rem;
            margin-bottom: 30px;
        }

        /* Click to Play Button */
        .play-btn {
            padding: 14px 36px;
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: bold;
            font-family: inherit;
            color: #000;
            background: #FFD700;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px #FFD700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: transform 0.2s, background-color 0.2s;
        }

        .play-btn:hover,
        .play-btn:active {
            transform: scale(1.08);
            background: #FFF;
            box-shadow: 0 0 25px #FFF;
        }

        /* Loading Bar Spinner */
        .loading-box {
            width: 240px;
            height: 12px;
            border: 2px solid #FFD700;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: #FFD700;
            box-shadow: 0 0 10px #FFD700;
            transition: width 0.1s linear;
        }

        .loading-text {
            color: #FFB8AE;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
                text-shadow: 0 0 15px #FFD700;
            }

            to {
                transform: scale(1.05);
                text-shadow: 0 0 25px #FFD700, 0 0 40px #FF8C00;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <!-- Game Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- 1. LOADING SCREEN OVERLAY -->
        <div id="loading-screen" class="overlay">
            <div class="arcade-title">PAC-MAN</div>
            <div class="loading-text">LOADING MAZE...</div>
            <div class="loading-box">
                <div id="loading-bar" class="loading-bar"></div>
            </div>
        </div>

        <!-- 2. START / TITLE SCREEN OVERLAY -->
        <div id="start-screen" class="overlay hidden">
            <div class="arcade-title">PAC-MAN</div>
            <div class="ghost-row">🔴 🩷 🩵 🟠</div>
            <button id="play-btn" class="play-btn">▶ CLICK TO PLAY</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="maze.js"></script>
    <script src="renderer.js"></script>
    <script src="game.js"></script>

</body>

</html>
